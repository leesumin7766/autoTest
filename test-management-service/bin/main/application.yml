server:
  port: 8082
spring:
  application:
    name: test-management-service
  datasource:
    url: jdbc:postgresql://db:5432/autotest
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:8333}
  region: us-east-1
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket: autotest-submissions
  enabled: true
  path-style-access: true
