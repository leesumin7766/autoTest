server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://db:5432/autotest
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: auth
    default-schema: auth
    table: auth_schema_history
    locations: classpath:db/auth-migration
