server:
  port: 8082
spring:
  application:
    name: test-management-service
  datasource:
    url: jdbc:postgresql://db:5432/autotest
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:8333}
  region: us-east-1
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket: autotest-docs
  enabled: true
  path-style-access: true
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8005}
  product-description:
    content-timeout-seconds: ${AI_SERVICE_PRODUCT_DESCRIPTION_CONTENT_TIMEOUT_SECONDS:21600}
product-description:
  internal-token: ${PRODUCT_DESCRIPTION_INTERNAL_TOKEN:}
  generation-enabled: ${PRODUCT_DESCRIPTION_GENERATION_ENABLED:false}
