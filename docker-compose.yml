services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.port.grpc=8334 -ip.bind=0.0.0.0
    ports: ["8333:8333", "8334:8334", "9333:9333"]
    volumes: [seaweed-data:/data]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}

  db:
    build:
      context: ./db
    image: autotest-db-pgvector
    container_name: autotest-db-1
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: autotest
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d autotest"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/autotest
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}

  test-management-service:
    build:
      context: .
      dockerfile: test-management-service/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/autotest
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      AI_SERVICE_URL: http://ai-service:8005

  test-execution-service:
    build:
      context: .
      dockerfile: test-execution-service/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/autotest
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test

  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/autotest
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      test-management-service:
        condition: service_healthy
      test-execution-service:
        condition: service_started
      report-service:
        condition: service_started

  ai-service:
    build: ./ai-service
    container_name: autotest-ai-service-1
    ports:
      - "8005:8005"
    environment:
      AI_DATABASE_URL: postgresql://test:test@db:5432/autotest
    volumes:
      - ./ai-service:/app
    depends_on:
      db:
        condition: service_healthy

  crawler-service:
    build: ./crawler-service
    container_name: autotest-crawler-1
    ports:
      - "8006:8006"
    volumes:
      - ./crawler-service:/app

volumes:
  db_data:
  seaweed-data:
